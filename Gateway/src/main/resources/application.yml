server:
  port: 8088

spring:
  application:
    name: Gateway
  cloud:
    nacos:
      server-addr: localhost:8848
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: # 允许的HTTP方法
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*" # 允许的请求头
            allowCredentials: true # 是否允许凭证传递
            maxAge: 360000 # 预检请求的结果缓存时间（毫秒）
      default-filters:
         - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
      routes:
        - id: DeptService
          uri: lb://DeptService
          predicates:
            - Path=/depts/**
        - id: EmpService
          uri: lb://EmpService
          predicates:
            - Path=/emps/**
        - id: LoginService
          uri: lb://LoginService
          predicates:
            - Path=/login